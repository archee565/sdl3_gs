[workspace]
members = ["proc_macros"]

[package]
name = "sdl3_gs"
version = "0.1.2"
edition = "2024"
description = "Safe Rust wrapper around SDL3's GPU API"
license = "MIT"
repository = "https://github.com/archee565/sdl3_gs.git"
keywords = ["sdl3", "gpu", "graphics", "gamedev"]
categories = ["game-development", "graphics", "rendering"]

[features]
build-from-source = ["sdl3-sys/build-from-source"]
build-from-source-static = ["sdl3-sys/build-from-source-static"]
link-static = ["sdl3-sys/link-static"]
sdl-lean-and-mean = ["sdl3-sys/sdl-lean-and-mean"]
link-framework = ["sdl3-sys/link-framework"]
verbose = []
shader-compiler = ["dep:rayon"]

[dependencies]
#sdl3-sys = { path="/home/peter/git/sdl3-sys-rs/sdl3-sys"   }
sdl3-sys = { version = "0.6" }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
proc_macros = { path = "proc_macros" }
rayon = { version = "1", optional = true }

[build-dependencies]
rayon = "1"

[lib]
name = "sdl3_gs"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo/src/main.rs"
